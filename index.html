<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hurbil · Marketplace de Acompañamiento en Bilbao</title>
<link rel="manifest" href="/Hurbil/manifest.json">
<link rel="apple-touch-icon" href="/Hurbil/logo.png">
<link rel="icon" type="image/png" href="/Hurbil/logo.png">
<meta name="theme-color" content="#2D5373">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#F6F7F5;--c:#fff;--bd:#E2E8F0;--p:#2D5373;--ph:#244560;--s:#447458;--sb:#EBF1F6;--sbd:#D6E2EC;--t:#1E293B;--pt:#fff;--st:#fff;--r:#C0463F;--m:#64748B;--warn:#FEF3C7;--warnb:#D97706}
body.hc{--bg:#000;--c:#000;--bd:#FFE600;--p:#FFE600;--ph:#fff;--s:#FFE600;--sb:#1a1a00;--sbd:#FFE600;--t:#FFE600;--pt:#000;--st:#000;--r:#FFE600;--m:#FFE600;--warn:#1a1a00;--warnb:#FFE600}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:1rem/1.55 Nunito,system-ui,sans-serif}
a{color:var(--p);font-weight:700}h1,h2,h3{font-weight:800;color:var(--t);line-height:1.2;margin:.2em 0}h1{font-size:1.75rem}h2{font-size:1.4rem}h3{font-size:1.15rem}
header{background:var(--c);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.hw{max-width:780px;margin:auto;padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center;justify-content:space-between}
.lg{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--t)}.lg b{display:block;font-size:1.05rem;line-height:1.2}.lg small{color:var(--m);font-weight:700}
.ct{display:flex;flex-wrap:nowrap;gap:.35rem;align-items:center;margin-left:auto}.hz{max-width:780px;margin:auto;padding:0 1rem .5rem;display:flex;justify-content:flex-end;gap:.5rem;align-items:center}
.seg{display:inline-flex;border:1px solid var(--sbd);border-radius:.9rem;overflow:hidden;background:var(--c)}.seg button{border:0;background:var(--c);padding:.3rem .7rem;font-weight:800;min-height:42px}
.seg button[aria-pressed=true],.sw[aria-checked=true],.ib[aria-pressed=true]{background:var(--p);color:var(--pt)}
.ib,.sw,.pill{border:1px solid var(--sbd);background:var(--sb);border-radius:2rem;padding:.3rem .85rem;font-weight:800;min-height:42px;color:var(--t);text-decoration:none;display:inline-flex;white-space:nowrap;align-items:center;position:relative}
.rd{flex:none;border-radius:50%;width:42px;height:42px;padding:0;justify-content:center;background:var(--c);font-size:1.3rem}.sw{font-size:.85rem}
button{font:inherit;cursor:pointer;color:inherit}
main{max-width:680px;margin:auto;padding:1rem 1rem 7rem}
.card{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:1.15rem;margin:.85rem 0;box-shadow:0 1px 4px #1e293b0f}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.row>.grow{flex:1}
.btn{background:var(--p);color:var(--pt);border:1px solid var(--p);border-radius:14px;padding:.75rem 1.2rem;font-weight:800;font-size:1rem;min-height:50px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.btn:hover{background:var(--ph)}.btn.g{background:var(--sb);color:var(--t);border-color:var(--sbd)}.btn.s{background:var(--s);border-color:var(--s);color:var(--st)}.btn.r{background:var(--r);border-color:var(--r);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.spk{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:#DCE8F2;color:#1E293B;font-size:1.1rem;touch-action:manipulation}
.role-card{border:2px solid var(--sbd);border-radius:18px;padding:1.2rem;text-align:left;background:var(--c);width:100%;display:flex;gap:1rem;align-items:center;margin:.6rem 0}
.role-card.pri{border-color:var(--s);background:#EFF5F1}.role-card.on{border-width:3px;border-color:var(--p)}
body.hc .role-card.pri{background:#1a1a00}
.pin-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:.8rem 0}
.pin-box{background:var(--sb);border:2px solid var(--p);border-radius:14px;padding:.8rem;text-align:center}
.pin-num{font-size:2rem;font-weight:800;letter-spacing:.25em;display:block;margin-top:.2rem}
.warn-box{background:var(--warn);border:2px solid var(--warnb);border-radius:14px;padding:.9rem;margin:.8rem 0;font-weight:700}
.receipt{background:var(--sb);border:1px dashed var(--p);border-radius:14px;padding:1rem;margin:.8rem 0}
.receipt-row{display:flex;justify-content:space-between;margin:.3rem 0}
.bd,.tag{display:inline-block;background:var(--sb);color:var(--t);border:1px solid var(--sbd);border-radius:2rem;padding:.15rem .75rem;font-weight:800;font-size:.82rem}.mut{color:var(--m)}
.badge{background:#ef4444;color:#fff;font-size:.72rem;font-weight:800;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;margin-left:.3rem}
.sp-pill{border:1px solid var(--bd);background:var(--c);border-radius:999px;padding:.4rem .9rem;font-weight:700;font-size:.9rem;min-height:40px;display:inline-flex;align-items:center;gap:.35rem;margin:.2rem}
.sp-pill.on{border:2px solid var(--s);background:#EFF5F1;color:var(--s);font-weight:800}
input,textarea,select{font:inherit;width:100%;padding:.7rem .85rem;border:1px solid var(--sbd);border-radius:12px;background:var(--c);color:var(--t);min-height:48px}
label{font-weight:800;display:block;margin:.75rem 0 .3rem}
.fab{position:fixed;right:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.5rem;z-index:6}
.fab button{border:0;border-radius:2rem;padding:.65rem 1.1rem;font-weight:800;font-size:.95rem;box-shadow:0 4px 12px #1e293b33}
.sos{background:var(--r);color:#fff}.cb{background:var(--p);color:var(--pt)}
.ov{position:fixed;inset:0;background:#1e293b99;z-index:9;display:flex;align-items:center;justify-content:center;padding:1rem}
.mo{background:var(--c);border:1px solid var(--bd);border-radius:20px;padding:1.2rem;max-width:500px;width:100%;max-height:90vh;overflow:auto}
.ig-feed{max-height:360px;min-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:.45rem;padding:.6rem;background:var(--bg);border-radius:12px}
.ig-me{align-self:flex-end;max-width:80%;background:var(--p);color:var(--pt);padding:.6rem .9rem;border-radius:16px 16px 4px 16px}
.ig-them{align-self:flex-start;max-width:80%;background:var(--c);border:1px solid var(--bd);padding:.6rem .9rem;border-radius:16px 16px 16px 4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:5.5rem;background:var(--t);color:var(--bg);padding:.8rem 1.2rem;border-radius:1rem;z-index:12;font-weight:800;max-width:92%}
.star{font-size:2rem;background:none;border:0;color:#eab308;padding:0 .1rem}
body.easy .btn{font-size:1.25rem;padding:1rem 1.3rem}
body.easy .adv{display:none}
</style></head><body>
<header id="hd"></header><main id="app"></main>
<div id="fab"></div><div id="md"></div><div id="toast" role="status" hidden></div>

<script>
const SB_URL='https://oijhfovricxgpnczwpfv.supabase.co';
const SB_KEY='sb_publishable_I1I6eY2egVrjwMzbDqrs0Q_2EK05T2C';
const sb=window.supabase.createClient(SB_URL,SB_KEY);

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n||0).toFixed(2).replace('.',',')+' €';
const d0=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const randPin=()=>String(1000+Math.floor(Math.random()*9000));

const BARRIOS=['Indautxu','Abando','Deusto','Santutxu','Casco Viejo','Begoña','Rekalde','Uribarri','Basurto','Txurdinaga','Otxarkoaga','Miribilla'];
const TASKS=[
  ['walk','🚶 Paseo y compañía','🚶 Ibilaldia eta konpainia'],
  ['shop','🛒 Compra / Recados','🛒 Erosketak / Egitekoak'],
  ['med','🏥 Acompañamiento médico','🏥 Mediku-laguntza'],
  ['tech','📱 Ayuda con móvil / papeleo','📱 Mugikorra / paperak']
];
const PLATFORM_FEE=3.50;

let st={
  lang:'es',fs:1,hc:0,easy:0,
  route:'explore',md:null,
  uid:null,prof:null,compProf:null,
  beneficiaries:[],companions:[],bookings:[],messages:[],
  // Filtros de búsqueda
  fBarrio:'',fDate:d0(1),fTime:'11:00',
  // Registro / Login
  authMode:'register',regRole:'family',regName:'',regEmail:'',regPhone:'',regPass:'',regLegal:false,
  // Formulario nuevo beneficiario
  bSelf:false,bName:'',bBarrio:'Indautxu',bAddr:'',bNotes:'',bPhone:'',
  // Flujo de reserva
  selComp:null,bkBenId:'',bkDate:d0(1),bkTime:'11:00',bkDur:1.5,bkTasks:['walk'],bkNotes:'',bkNonMed:false,
  // Chat & Soporte & Valoración
  chatPeerId:null,chatText:'',pinInput:'',incBookingId:null,incText:'',rateBookingId:null,rateStars:5,rateReview:'',
  // Admin
  adminPass:'',adminOk:false
};

const _=(es,eu)=>st.lang=='eu'?eu:es;
const toast=m=>{const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,4200)};
let sayBtn=null;
const stopSay=()=>{if(window.speechSynthesis)speechSynthesis.cancel();if(sayBtn){sayBtn.textContent='🔊';sayBtn=null}};
const S=t=>`<button type="button" class="spk" data-a="say" data-t="${esc(t)}" aria-label="Escuchar">🔊</button>`;
const say=(t,el)=>{if(!window.speechSynthesis)return;const same=sayBtn===el;stopSay();if(same)return;sayBtn=el;el.textContent='⏹️';const u=new SpeechSynthesisUtterance(t);u.lang=st.lang=='eu'?'eu-ES':'es-ES';u.onend=u.onerror=stopSay;speechSynthesis.speak(u)};

// Filtro anti-fugas de teléfono/email en chat antes de tener reserva confirmada
function sanitizeChat(text,hasConfirmedBooking){
  if(hasConfirmedBooking)return text;
  const blockedTag=_('[Dato de contacto oculto hasta confirmar reserva]','[Kontaktua ezkutatuta erreserba baieztatu arte]');
  return text
    .replace(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+)/gi,blockedTag)
    .replace(/(\+?\d[\d\s\-().]{7,}\d)/g,blockedTag);
}

// Expiración automática de 14 horas
async function checkExpiredBookings(){
  const now=Date.now();
  for(const b of st.bookings){
    if(b.status==='pending_companion'&&new Date(b.expires_at).getTime()<now){
      b.status='expired';
      await sb.from('mp_bookings').update({status:'expired'}).eq('id',b.id);
    }
  }
}

async function syncAll(){
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user){
    st.uid=session.user.id;
    const {data:p}=await sb.from('mp_profiles').select('*').eq('id',st.uid).single();
    if(p)st.prof=p;
    if(p?.role==='companion'){
      const {data:cp}=await sb.from('mp_companions').select('*').eq('user_id',st.uid).single();
      st.compProf=cp;
    }
    const {data:bens}=await sb.from('mp_beneficiaries').select('*').eq('family_id',st.uid);
    if(bens){st.beneficiaries=bens;if(!st.bkBenId&&bens[0])st.bkBenId=bens[0].id;}
    const {data:bks}=await sb.from('mp_bookings').select('*, mp_beneficiaries(*), family:mp_profiles!mp_bookings_family_id_fkey(full_name,phone,email), companion:mp_profiles!mp_bookings_companion_id_fkey(full_name,avatar_url)').order('created_at',{ascending:false});
    if(bks){st.bookings=bks;await checkExpiredBookings();}
    const {data:msgs}=await sb.from('mp_messages').select('*').or(`sender_id.eq.${st.uid},receiver_id.eq.${st.uid}`).order('created_at',{ascending:true});
    if(msgs)st.messages=msgs;
  }else{
    st.uid=null;st.prof=null;st.compProf=null;
  }
  // Cargar acompañantes (verificados para familias, todos para admin)
  const {data:comps}=await sb.from('mp_companions').select('*, mp_profiles(id,full_name,avatar_url,email,phone)');
  if(comps)st.companions=comps;
  render();
}

function hdr(){
  const roleBadge=st.prof?`<span class="bd">${st.prof.role==='companion'?_('Acompañante','Laguntzailea'):st.prof.role==='admin'?'Admin':_('Familia','Familia')}</span>`:'';
  return`<div class="hw">
    <a href="#" class="lg" data-a="go" data-v="explore"><img src="/Hurbil/logo.png" style="width:40px;height:40px;border-radius:10px"><span><b>Hurbil</b><small>Bilbao · Marketplace</small></span></a>
    <div class="ct">
      <span class="seg"><button data-a="lang" data-v="es" aria-pressed="${st.lang=='es'}">ES</button><button data-a="lang" data-v="eu" aria-pressed="${st.lang=='eu'}">EU</button></span>
      <span class="seg"><button data-a="fs" data-v="-1">A-</button><button data-a="fs" data-v="1">A+</button></span>
      <button class="ib rd" data-a="hc" aria-pressed="${!!st.hc}">◐</button>
      <button class="pill" data-a="go" data-v="${st.uid?'profile':'auth'}">👤 ${st.prof?esc(st.prof.full_name.split(' ')[0]):_('Entrar','Sartu')} ${roleBadge}</button>
    </div>
  </div>
  <div class="hz">
    ${st.prof?.role==='companion'
      ?`<button class="pill" data-a="go" data-v="comp_dash">📋 ${_('Mis Servicios','Nire Zerbitzuak')}</button><button class="pill" data-a="go" data-v="comp_edit">⚙️ ${_('Tarifa y Barrios','Tarifa eta Auzoak')}</button>`
      :`<button class="pill" data-a="go" data-v="explore">🔍 ${_('Buscar Acompañante','Bilatu Laguntzailea')}</button>${st.uid?`<button class="pill" data-a="go" data-v="bookings">📅 ${_('Mis Citas','Nire Hitzorduak')}</button>`:''}`}
    <button class="sw" aria-checked="${!!st.easy}" data-a="easy">${_('Modo Fácil','Modu Erraza')}</button>
  </div>`;
}

// PANTALLA 1: REGISTRO CON ROLES Y CHECKBOX LEGAL OBLIGATORIO
function viewAuth(){
  if(st.authMode==='login'){
    return`<div class="card"><h2>🔑 ${_('Iniciar sesión en Hurbil','Saioa hasi Hurbilen')}</h2>
      <label>${_('Correo electrónico','Posta elektronikoa')}</label><input id="lg_e" type="email" value="${esc(st.regEmail)}" oninput="st.regEmail=this.value">
      <label>${_('Contraseña','Pasahitza')}</label><input id="lg_p" type="password" value="${esc(st.regPass)}" oninput="st.regPass=this.value">
      <button class="btn s" style="width:100%;margin-top:1rem" data-a="do_login">${_('Entrar','Sartu')}</button>
      <p style="text-align:center;margin-top:1rem"><a href="#" data-a="set_auth" data-v="register">${_('¿No tienes cuenta? Regístrate aquí','Ez duzu konturik? Eman izena hemen')}</a></p>
    </div>`;
  }
  return`<div class="card">
    <div class="row"><h2 class="grow">👋 ${_('Crea tu cuenta en Hurbil','Sortu zure kontua Hurbilen')}</h2>${S(_('Elige si buscas acompañamiento para ti o un familiar, o si quieres ofrecer tus servicios como acompañante independiente.','Aukeratu laguntza bilatzen duzun edo laguntzaile gisa lan egin nahi duzun.'))}</div>
    <p class="mut">${_('Paso 1: Elige cómo vas a usar la plataforma','1. urratsa: Aukeratu nola erabiliko duzun plataforma')}</p>
    <button type="button" class="role-card pri ${st.regRole==='family'?'on':''}" data-a="reg_role" data-v="family">
      <span style="font-size:2rem">🏡</span>
      <div><b style="font-size:1.15rem">${_('Busco acompañamiento','Laguntza bilatzen dut')}</b><br><small class="mut">${_('Para mí o para un familiar mayor en Bilbao','Niretzat edo Bilboko adineko senide batentzat')}</small></div>
    </button>
    <button type="button" class="role-card ${st.regRole==='companion'?'on':''}" data-a="reg_role" data-v="companion">
      <span style="font-size:2rem">🤝</span>
      <div><b style="font-size:1.15rem">${_('Quiero ofrecer acompañamiento','Laguntza eskaini nahi dut')}</b><br><small class="mut">${_('Colaborador independiente con tus propios horarios y tarifa','Laguntzaile independentea zure ordutegi eta tarifarekin')}</small></div>
    </button>
    <label>${_('Nombre y apellidos','Izen-abizenak')}</label><input value="${esc(st.regName)}" oninput="st.regName=this.value" placeholder="Ej. Amaia Etxebarria">
    <label>${_('Correo electrónico','Posta elektronikoa')}</label><input type="email" value="${esc(st.regEmail)}" oninput="st.regEmail=this.value" placeholder="amaia@ejemplo.com">
    <label>${_('Teléfono móvil','Telefono mugikorra')}</label><input type="tel" value="${esc(st.regPhone)}" oninput="st.regPhone=this.value" placeholder="600 000 000">
    <label>${_('Contraseña','Pasahitza')}</label><input type="password" value="${esc(st.regPass)}" oninput="st.regPass=this.value" placeholder="Mínimo 6 caracteres">
    <label style="display:flex;gap:.6rem;align-items:flex-start;margin-top:1rem;font-weight:700;cursor:pointer">
      <input type="checkbox" style="width:22px;height:22px;min-height:auto;margin-top:.2rem" ${st.regLegal?'checked':''} onchange="st.regLegal=this.checked;render()">
      <span style="font-size:.9rem">${_('Acepto los Términos y Condiciones: entiendo que Hurbil actúa exclusivamente como plataforma tecnológica de intermediación, que los acompañantes son colaboradores independientes responsables de sus obligaciones fiscales, y que el servicio es estrictamente no sanitario.','Baldintzak onartzen ditut: Hurbil bitartekaritza-plataforma teknologikoa dela eta zerbitzua ez dela sanitarioa ulertzen dut.')}</span>
    </label>
    <button class="btn s" style="width:100%;margin-top:1rem" data-a="do_register" ${st.regLegal?'':'disabled'}>${_('Crear cuenta','Kontua sortu')}</button>
    <p style="text-align:center;margin-top:1rem"><a href="#" data-a="set_auth" data-v="login">${_('Ya tengo cuenta · Iniciar sesión','Badut kontua · Saioa hasi')}</a></p>
  </div>`;
}

// PANTALLA 2: EXPLORAR ACOMPAÑANTES VERIFICADOS (FILTRO POR BARRIO Y FECHA/HORA)
function viewExplore(){
  const verified=st.companions.filter(c=>c.status==='verified'&&(!st.fBarrio||(c.neighborhoods||[]).includes(st.fBarrio)));
  const prevCompIds=[...new Set(st.bookings.filter(b=>b.family_id===st.uid&&b.status==='completed').map(b=>b.companion_id))];

  return`<div class="row"><h1 class="grow">🔍 ${_('Acompañantes de confianza en Bilbao','Konfiantzazko laguntzaileak Bilbon')}</h1>${S(_('Filtra por tu barrio de Bilbao y fecha. El precio mostrado ya incluye IVA y la tarifa de gestión y seguridad de Hurbil.','Iragazi zure Bilboko auzoaren eta dataren arabera.'))}</div>
  <div class="card">
    <div class="row">
      <div class="grow"><label style="margin-top:0">📍 ${_('Barrio de Bilbao','Bilboko auzoa')}</label>
        <select onchange="st.fBarrio=this.value;render()"><option value="">${_('Todos los barrios','Auzo guztiak')}</option>${BARRIOS.map(b=>`<option value="${b}" ${st.fBarrio===b?'selected':''}>${b}</option>`).join('')}</select>
      </div>
      <div><label style="margin-top:0">📅 ${_('Fecha','Data')}</label><input type="date" min="${d0(0)}" value="${st.fDate}" onchange="st.fDate=this.value"></div>
      <div><label style="margin-top:0">🕒 ${_('Hora','Ordua')}</label><input type="time" value="${st.fTime}" onchange="st.fTime=this.value"></div>
    </div>
  </div>
  ${verified.length?verified.map(c=>{
    const p=c.mp_profiles||{};
    const finalHourly=Number(c.hourly_rate)+PLATFORM_FEE;
    const isRepeat=prevCompIds.includes(c.user_id);
    const doneWithThis=st.bookings.filter(b=>b.family_id===st.uid&&b.companion_id===c.user_id&&b.status==='completed').length;
    const nextIsFreeFee=doneWithThis>0&&doneWithThis%5===0;
    return`<article class="card">
      <div class="row" style="align-items:flex-start">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--sb);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.4rem;flex:none">${esc((p.full_name||'H')[0])}</div>
        <div class="grow">
          <div class="row" style="justify-content:space-between">
            <h3 style="margin:0">${esc(p.full_name)} <span class="bd" style="background:#DCFCE7;color:#166534">✓ ${_('Verificado','Egiaztatuta')}</span></h3>
            <div style="text-align:right"><b style="font-size:1.3rem;color:var(--s)">${fmt(finalHourly)}/h</b><br><small class="mut">${_('IVA y seguridad incl.','BEZa eta segurtasuna barne')}</small></div>
          </div>
          <p class="mut" style="margin:.2rem 0">⭐ ${Number(c.rating_avg||5).toFixed(1)} (${c.rating_count||0}) · 📍 ${(c.neighborhoods||[]).join(', ')}</p>
          <p style="margin:.4rem 0">${esc(c.bio||_('Acompañante verificado en Bilbao para paseos, compras y compañía.','Bilboko laguntzaile egiaztatua.'))}</p>

      <textarea rows="3" oninput="st.rateReview=this.value" placeholder="${_('Escribe tu opinión para ayudar a otras familias de Bilbao...','Idatzi zure iritzia...')}"></textarea>
      <button class="btn s" style="width:100%;margin-top:.8rem" data-a="save_rate">${_('Publicar valoración','Balorazioa argitaratu')}</button>
      <button class="btn g" style="width:100%;margin-top:.5rem" data-a="close_md">Cerrar</button>
    </div></div>`;
  }
  return'';
}

function render(){
  document.documentElement.lang=st.lang;
  document.body.className=(st.hc?'hc ':'')+(st.easy?'easy':'');
  document.documentElement.style.fontSize=(16+st.fs*2)+'px';
  $('#hd').innerHTML=hdr();
  const views={auth:viewAuth,explore:viewExplore,book:viewBookForm,bookings:viewBookings,comp_dash:viewCompDash,comp_edit:viewCompEdit,profile:viewProfile,admin:viewAdmin};
  const fnView=views[st.route]||viewExplore;
  $('#app').innerHTML=fnView()+`<footer class="adv" style="text-align:center;margin-top:2rem"><small class="mut">Hurbil Bilbao · 644 270 017 · <a href="#" data-a="go" data-v="admin">Admin Verificación</a></small></footer>`;
  $('#fab').innerHTML=`<div class="fab"><button class="sos" onclick="open('tel:644270017')">🆘 SOS 644 270 017</button></div>`;
  $('#md').innerHTML=renderModal();
}

// CONTROLADOR DE EVENTOS
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,v=el.dataset.v;
  if(a==='go'){e.preventDefault();st.route=v;render();}
  if(a==='lang'){st.lang=v;render();}
  if(a==='fs'){st.fs=Math.max(-1,Math.min(4,st.fs+ +v));render();}
  if(a==='hc'){st.hc^=1;render();}
  if(a==='easy'){st.easy^=1;render();}
  if(a==='say'){say(el.dataset.t,el);}
  if(a==='set_auth'){e.preventDefault();st.authMode=v;render();}
  if(a==='reg_role'){st.regRole=v;render();}
  if(a==='close_md'){st.md=null;render();}

  // Registro con rol y términos legales
  if(a==='do_register'){
    if(!st.regLegal||!st.regName||!st.regEmail||!st.regPass)return toast(_('Completa todos los campos y acepta los términos.','Bete eremu guztiak.'));
    const {data,error}=await sb.auth.signUp({email:st.regEmail.trim(),password:st.regPass});
    if(error)return toast(error.message);
    const uid=data.user.id;
    await sb.from('mp_profiles').insert({id:uid,role:st.regRole,full_name:st.regName.trim(),email:st.regEmail.trim(),phone:st.regPhone.trim()});
    if(st.regRole==='companion'){
      await sb.from('mp_companions').insert({user_id:uid,status:'pending_approval',hourly_rate:12.00,neighborhoods:['Indautxu']});
    }
    toast(_('¡Cuenta creada!','Kontua sortuta!'));
    st.route=st.regRole==='companion'?'comp_edit':'profile';
    await syncAll();
  }

  if(a==='do_login'){
    const {error}=await sb.auth.signInWithPassword({email:st.regEmail.trim(),password:st.regPass});
    if(error)return toast(_('Credenciales incorrectas','Datu okerrak'));
    await syncAll();
    st.route=st.prof?.role==='companion'?'comp_dash':'explore';
    render();
  }

  if(a==='logout'){await sb.auth.signOut();st.route='explore';await syncAll();}

  // Guardar beneficiario
  if(a==='add_ben'){
    if(!st.bName||!st.bAddr||!st.bPhone)return toast(_('Rellena nombre, dirección y teléfono.','Bete izena, helbidea eta telefonoa.'));
    await sb.from('mp_beneficiaries').insert({family_id:st.uid,is_self:st.bSelf,full_name:st.bName,neighborhood:st.bBarrio,exact_address:st.bAddr,access_notes:st.bNotes,contact_phone:st.bPhone});
    st.bName='';st.bAddr='';st.bNotes='';st.bPhone='';
    toast(_('Beneficiario guardado','Onuraduna gordeta'));
    await syncAll();
  }

  // Iniciar reserva
  if(a==='start_book'){
    if(!st.uid){st.route='auth';render();return;}
    st.selComp=v;st.bkDate=st.fDate;st.bkTime=st.fTime;st.bkNonMed=false;st.route='book';render();
  }
  if(a==='toggle_task'){
    st.bkTasks=st.bkTasks.includes(v)?st.bkTasks.filter(x=>x!==v):[...st.bkTasks,v];render();
  }

  // Enviar solicitud de reserva
  if(a==='submit_booking'){
    const c=st.companions.find(x=>x.user_id===st.selComp);
    const dur=Number(st.bkDur);
    const doneCount=st.bookings.filter(b=>b.family_id===st.uid&&b.companion_id===c.user_id&&b.status==='completed').length;
    const discount=(doneCount>0&&doneCount%5===0)?PLATFORM_FEE:0;
    const compTotal=Number(c.hourly_rate)*dur;
    const platTotal=Math.max(0,(PLATFORM_FEE*dur)-discount);
    await sb.from('mp_bookings').insert({
      family_id:st.uid,beneficiary_id:st.bkBenId,companion_id:c.user_id,
      service_date:st.bkDate,start_time:st.bkTime,duration_hours:dur,
      tasks:st.bkTasks,day_notes:st.bkNotes,non_medical_accepted:true,
      companion_rate:c.hourly_rate,platform_fee_rate:PLATFORM_FEE,loyalty_discount:discount,
      companion_total:compTotal,platform_total:platTotal,total_amount:compTotal+platTotal
    });
    toast(_('Solicitud enviada. El acompañante tiene 14 horas para responder.','Eskaera bidalita.'));
    st.route='bookings';await syncAll();
  }

  // Aceptar o rechazar cita (Acompañante) -> genera Doble PIN y autoriza pago Stripe
  if(a==='comp_resp'){
    const id=el.dataset.id;
    const upd={status:v};
    if(v==='accepted'){upd.pin_in=randPin();upd.pin_out=randPin();}
    await sb.from('mp_bookings').update(upd).eq('id',id);
    if(v==='accepted'){
      await sb.functions.invoke('hurbil-api',{body:{action:'authorize_booking',payload:{booking_id:id}}});
    }
    toast(v==='accepted'?_('Cita aceptada · Doble PIN generado','Hitzordua onartuta'):_('Cita rechazada','Hitzordua baztertuta'));
    await syncAll();
  }

  // Validar PIN Entrada -> in_progress + Email automático
  if(a==='verify_in'){
    const b=st.bookings.find(x=>x.id===v);
    if(st.pinInput.trim()!==b.pin_in)return toast(_('PIN de Entrada incorrecto','Sarrera PIN okerra'));
    await sb.from('mp_bookings').update({status:'in_progress',pin_in_at:new Date().toISOString()}).eq('id',v);
    await sb.functions.invoke('hurbil-api',{body:{action:'notify_pin_in',payload:{booking_id:v}}});
    st.pinInput='';toast(_('PIN Entrada verificado · Familia notificada por email','Sarrera PINa egiaztatuta'));
    await syncAll();
  }

  // Validar PIN Salida -> completed + Liberar Stripe Connect + Email automático
  if(a==='verify_out'){
    const b=st.bookings.find(x=>x.id===v);
    if(st.pinInput.trim()!==b.pin_out)return toast(_('PIN de Salida incorrecto','Irteera PIN okerra'));
    await sb.from('mp_bookings').update({status:'completed',pin_out_at:new Date().toISOString()}).eq('id',v);
    await sb.functions.invoke('hurbil-api',{body:{action:'release_split_payout',payload:{booking_id:v}}});
    st.pinInput='';toast(_('Servicio finalizado · Pago liberado a tu cuenta','Zerbitzua osatuta'));
    await syncAll();
  }

  // Cancelación (regla 24h)
  if(a==='cancel_bk'){
    const {data}=await sb.functions.invoke('hurbil-api',{body:{action:'cancel_booking',payload:{booking_id:v}}});
    toast(data?.isFree?_('Cita cancelada gratuitamente (>24h)','Doan ezeztatuta'):_('Cita cancelada con retención (<24h)','Ezeztatuta (<24h)'));
    await syncAll();
  }

  // Chat protegido + videollamada 10 min
  if(a==='open_chat'){if(!st.uid){st.route='auth';render();return;}st.chatPeerId=v;st.md='chat';render();}
  if(a==='send_chat'||a==='req_video'){
    const hasConfirmed=st.bookings.some(b=>((b.family_id===st.uid&&b.companion_id===st.chatPeerId)||(b.companion_id===st.uid&&b.family_id===st.chatPeerId))&&['accepted','in_progress'].includes(b.status));
    const raw=a==='req_video'?'📹 '+_('Solicito una videollamada gratuita de 10 minutos para conocernos antes de reservar.','10 minutuko doako bideo-deia eskatzen dut.'):st.chatText.trim();
    if(!raw)return;
    const clean=sanitizeChat(raw,hasConfirmed);
    await sb.from('mp_messages').insert({sender_id:st.uid,receiver_id:st.chatPeerId,content:clean,is_videocall:a==='req_video'});
    st.chatText='';await syncAll();
  }

  // Guardar perfil acompañante y Stripe Connect
  if(a==='toggle_barrio'){
    const arr=st.compProf.neighborhoods||[];
    st.compProf.neighborhoods=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];render();
  }
  if(a==='save_comp'){
    const rate=Math.max(8,Number($('#cp_rate').value)||12);
    const bio=$('#cp_bio').value;
    await sb.from('mp_companions').update({hourly_rate:rate,neighborhoods:st.compProf.neighborhoods,bio}).eq('user_id',st.uid);
    toast(_('Tarifa y barrios actualizados','Tarifa eta auzoak gordeta'));await syncAll();
  }
  if(a==='stripe_onboard'){
    const {data}=await sb.functions.invoke('hurbil-api',{body:{action:'connect_onboard',payload:{user_id:st.uid,email:st.prof.email,return_url:location.href}}});
    if(data?.url)location.href=data.url;
  }

  // Admin verificación
  if(a==='adm_verify'){
    await sb.from('mp_companions').update({status:v}).eq('user_id',el.dataset.id);
    toast('Estado actualizado a '+v);await syncAll();
  }

  // Incidencia y Valoraciones
  if(a==='open_inc'){st.incBookingId=v;st.md='inc';render();}
  if(a==='save_inc'){await sb.from('mp_bookings').update({incident_note:st.incText}).eq('id',st.incBookingId);st.md=null;toast('Incidencia registrada');await syncAll();}
  if(a==='open_rate'){st.rateBookingId=v;st.rateStars=5;st.rateReview='';st.md='rate';render();}
  if(a==='save_rate'){
    await sb.from('mp_bookings').update({rating:st.rateStars,review:st.rateReview}).eq('id',st.rateBookingId);
    const b=st.bookings.find(x=>x.id===st.rateBookingId);
    const compRatings=st.bookings.filter(x=>x.companion_id===b.companion_id&&x.rating);
    const avg=compRatings.reduce((s,x)=>s+x.rating,0)/compRatings.length;
    await sb.from('mp_companions').update({rating_avg:avg.toFixed(2),rating_count:compRatings.length}).eq('user_id',b.companion_id);
    st.md=null;toast(_('¡Gracias por tu valoración!','Eskerrik asko zure balorazioagatik!'));await syncAll();
  }
});

render();syncAll();setInterval(syncAll,15000);
</script></body></html>
