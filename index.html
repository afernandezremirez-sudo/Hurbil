<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hurbil · Bilbao · Acompañamiento a Mayores</title>
  <link rel="manifest" href="/Hurbil/manifest.json" />
  <meta name="theme-color" content="#0f5132" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f6f8f7;
      --card: #ffffff;
      --primary: #0f5132;
      --primary-light: #e6f4ea;
      --accent: #d97706;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
      --danger: #b91c1c;
      --font-scale: 1;
    }
    body.high-contrast {
      --bg: #000000;
      --card: #111111;
      --primary: #22c55e;
      --primary-light: #052e16;
      --text: #ffffff;
      --muted: #cbd5e1;
      --border: #ffffff;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: calc(16px * var(--font-scale));
      line-height: 1.5;
      padding-bottom: 80px;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .brand img { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; }
    .brand h1 { margin: 0; font-size: 1.25rem; color: var(--primary); }
    .brand small { display: block; font-size: 0.78rem; color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.92rem;
      transition: 0.15s;
    }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.primary:hover { opacity: 0.92; }
    button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    button.pill-active { background: var(--primary); color: #fff; border-color: var(--primary); }
    main { max-width: 820px; margin: 20px auto; padding: 0 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    h2, h3 { margin-top: 0; color: var(--primary); }
    label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: 0.95rem; }
    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
    }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .rate-box {
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      background: var(--card);
    }
    .rate-box.selected { border-color: var(--primary); background: var(--primary-light); }
    .rate-price { font-size: 1.35rem; font-weight: 800; color: var(--primary); }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--primary-light);
      color: var(--primary);
    }
    .badge.warn { background: #fef3c7; color: #92400e; }
    .badge.live { background: #dcfce7; color: #166534; }
    .pin-banner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 14px 0;
    }
    .pin-card {
      background: var(--primary-light);
      border: 2px dashed var(--primary);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
    }
    .pin-digits {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 6px;
      color: var(--primary);
      display: block;
      margin-top: 4px;
    }
    .task-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin: 4px 6px 4px 0;
      cursor: pointer;
    }
    .task-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .sos-float {
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: var(--danger);
      color: #fff;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(185,28,28,0.35);
      z-index: 99;
    }
    #toast {
      position: fixed;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>

<header>
  <div class="brand" onclick="nav('home')">
    <img src="/Hurbil/logo.png" alt="Hurbil" onerror="this.style.display='none'" />
    <div>
      <h1>Hurbil</h1>
      <small>Bilbao · Servicio Directo</small>
    </div>
  </div>
  <div class="toolbar">
    <button onclick="setLang('es')" id="btn-es" class="pill-active">ES</button>
    <button onclick="setLang('eu')" id="btn-eu">EU</button>
    <button onclick="changeScale(-0.1)">A-</button>
    <button onclick="changeScale(0.1)">A+</button>
    <button onclick="document.body.classList.toggle('high-contrast')">◐</button>
    <span id="nav-actions"></span>
  </div>
</header>

<main id="app"></main>

<a href="tel:644270017" class="sos-float">🆘 SOS 644 270 017</a>
<div id="toast"></div>

<script>
  const SUPABASE_URL = 'https://oijhfovricxgpnczwpfv.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_I1I6eY2egVrjwMzbDqrs0Q_2EK05T2C';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const BARRIOS_BILBAO = [
    'Abando', 'Indautxu', 'Deusto', 'Santutxu', 'Casco Viejo',
    'Uribarri', 'Begoña', 'Rekalde', 'Basurto', 'Zorroza', 'Otxarkoaga', 'Txurdinaga'
  ];

  const TAREAS_OPCIONES = [
    { id: 'paseo', es: '🚶 Paseo y compañía', eu: '🚶 Paseoa eta konpainia' },
    { id: 'compra', es: '🛒 Compra y recados', eu: '🛒 Erosketak eta enkarguak' },
    { id: 'medico', es: '🏥 Acompañamiento médico', eu: '🏥 Medikuarengana laguntzea' },
    { id: 'papeleo', es: '📱 Móvil y papeleo', eu: '📱 Mugikorra eta paperak' }
  ];

  const st = {
    lang: 'es',
    scale: 1,
    user: null,
    profile: null,
    beneficiaries: [],
    bookings: [],
    employees: [],
    notifications: [],
    route: 'auth',
    authMode: 'register',
    planType: 'single_hour',
    benId: '',
    serviceDate: new Date(Date.now() + 86400000).toISOString().split('T')[0],
    startTime: '10:30',
    durationHours: 1.5,
    selectedTasks: ['paseo'],
    extraNotes: ''
  };

  const _ = (es, eu) => st.lang === 'eu' ? eu : es;

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3200);
  }

  function setLang(l) {
    st.lang = l;
    document.getElementById('btn-es').classList.toggle('pill-active', l === 'es');
    document.getElementById('btn-eu').classList.toggle('pill-active', l === 'eu');
    render();
  }

  function changeScale(delta) {
    st.scale = Math.min(1.4, Math.max(0.85, st.scale + delta));
    document.documentElement.style.setProperty('--font-scale', st.scale);
  }

  function nav(r) {
    st.route = r;
    render();
  }

  function genPin() {
    return String(Math.floor(1000 + Math.random() * 9000));
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('payment') === 'success') {
      toast(_('✅ Pago confirmado en Hurbil. Saldo actualizado.', '✅ Ordainketa baieztatuta. Saldo eguneratua.'));
      window.history.replaceState({}, '', window.location.pathname);
    }

    const { data: { session } } = await sb.auth.getSession();
    if (session?.user) {
      st.user = session.user;
      await syncAll();
    } else {
      st.route = 'auth';
      render();
    }
  }

  async function syncAll() {
    if (!st.user) return;
    const { data: prof } = await sb.from('hurbil_profiles').select('*').eq('id', st.user.id).single();
    st.profile = prof;

    if (!prof) {
      st.route = 'auth';
      render();
      return;
    }

    const { data: notifs } = await sb.from('hurbil_notifications')
      .select('*').eq('user_id', st.user.id).order('created_at', { ascending: false }).limit(5);
    st.notifications = notifs || [];

    if (prof.role === 'family') {
      const { data: bens } = await sb.from('hurbil_beneficiaries').select('*').eq('family_id', st.user.id);
      st.beneficiaries = bens || [];
      if (st.beneficiaries.length && !st.benId) st.benId = st.beneficiaries[0].id;

      const { data: bks } = await sb.from('hurbil_bookings')
        .select('*, hurbil_beneficiaries(full_name, neighborhood, exact_address), hurbil_profiles!hurbil_bookings_employee_id_fkey(full_name, phone)')
        .eq('family_id', st.user.id)
        .order('service_date', { ascending: false });
      st.bookings = bks || [];
      if (st.route === 'auth') st.route = 'family_home';
    }

    if (prof.role === 'admin') {
      const { data: emps } = await sb.from('hurbil_profiles').select('*').eq('role', 'employee');
      st.employees = emps || [];

      const { data: bks } = await sb.from('hurbil_bookings')
        .select('*, hurbil_beneficiaries(full_name, neighborhood, exact_address, phone), hurbil_profiles!hurbil_bookings_family_id_fkey(full_name, phone)')
        .order('created_at', { ascending: false });
      st.bookings = bks || [];
      if (st.route === 'auth') st.route = 'admin_dash';
    }

    if (prof.role === 'employee') {
      const { data: bks } = await sb.from('hurbil_bookings')
        .select('*, hurbil_beneficiaries(full_name, neighborhood, exact_address, access_notes, phone), hurbil_profiles!hurbil_bookings_family_id_fkey(full_name, phone)')
        .eq('employee_id', st.user.id)
        .order('service_date', { ascending: true });
      st.bookings = bks || [];
      if (st.route === 'auth') st.route = 'emp_dash';
    }

    render();
  }

  async function handleRegister(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    if (!fd.get('non_medical_ok')) {
      return toast(_('Debes aceptar que es un servicio estrictamente no sanitario.', 'Zerbitzu ez-sanitarioa dela onartu behar duzu.'));
    }

    const email = fd.get('email').trim();
    const password = fd.get('password');
    const fullName = fd.get('full_name').trim();
    const phone = fd.get('phone').trim();
    const isSelf = fd.get('is_self') === 'on';

    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) return toast(error.message);

    if (!data?.user) {
      return toast(_('Revisa tu correo para confirmar la cuenta y luego inicia sesión.', 'Begiratu posta kontua baieztatzeko.'));
    }

    const uid = data.user.id;
    const { error: profErr } = await sb.from('hurbil_profiles').insert({
      id: uid,
      role: 'family',
      full_name: fullName,
      email,
      phone,
      accepted_non_medical_terms: true,
      bonus_hours: 0
    });
    if (profErr) return toast(profErr.message);

    const { error: benErr } = await sb.from('hurbil_beneficiaries').insert({
      family_id: uid,
      is_self: isSelf,
      full_name: isSelf ? fullName : fd.get('ben_name').trim(),
      neighborhood: fd.get('neighborhood'),
      exact_address: fd.get('exact_address').trim(),
      access_notes: fd.get('access_notes').trim(),
      phone: isSelf ? phone : fd.get('ben_phone').trim()
    });
    if (benErr) return toast(benErr.message);

    st.user = data.user;
    toast(_('¡Cuenta familiar creada en Hurbil!', 'Kontua sortuta!'));
    await syncAll();
  }

  async function handleLogin(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const { data, error } = await sb.auth.signInWithPassword({
      email: fd.get('email').trim(),
      password: fd.get('password')
    });
    if (error) return toast(_('Credenciales incorrectas o email sin confirmar', 'Datu okerrak'));
    st.user = data.user;
    await syncAll();
  }

  async function logout() {
    await sb.auth.signOut();
    st.user = null;
    st.profile = null;
    st.route = 'auth';
    render();
  }

  async function buyBonusPack(code, hours, amountEur) {
    toast(_('Activando bono en tu cuenta Hurbil...', 'Bonua aktibatzen...'));
    await sb.from('hurbil_payments').insert({
      family_id: st.user.id,
      product_code: code,
      amount_eur: amountEur,
      hours_credited: hours,
      status: 'paid'
    });

    const newBalance = Number(st.profile.bonus_hours || 0) + hours;
    await sb.from('hurbil_profiles').update({ bonus_hours: newBalance }).eq('id', st.user.id);
    toast(_(`✅ Bono activado: +${hours}h añadidas a tu cuenta`, `✅ Bonua aktibatuta: +${hours}h`));
    await syncAll();
  }

  async function createBooking() {
    if (!st.benId) return toast(_('Selecciona un beneficiario en Bilbao', 'Hautatu onuradun bat'));
    const dur = Number(st.durationHours);
    if (dur < 1) return toast(_('La duración mínima es de 1 hora', 'Gutxieneko iraupena ordu 1 da'));

    let totalEur = 0;
    let hoursUsed = 0;

    if (st.planType === 'bonus_use') {
      if (Number(st.profile.bonus_hours) < dur) {
        return toast(_('No tienes suficientes horas en tu bono. Adquiere un bono arriba.', 'Ez duzu nahikoa ordu bonuan.'));
      }
      hoursUsed = dur;
    } else if (st.planType === 'single_hour') {
      totalEur = dur * 21.00;
    } else if (st.planType === 'joint_plan') {
      totalEur = dur * 32.00;
    }

    const pinEntry = genPin();
    const pinExit = genPin();

    const { error } = await sb.from('hurbil_bookings').insert({
      family_id: st.user.id,
      beneficiary_id: st.benId,
      plan_type: st.planType,
      service_date: st.serviceDate,
      start_time: st.startTime,
      duration_hours: dur,
      total_price_eur: totalEur,
      hours_deducted: hoursUsed,
      tasks: st.selectedTasks,
      extra_notes: st.extraNotes,
      status: 'pending_assignment',
      pin_entry: pinEntry,
      pin_exit: pinExit
    });

    if (error) return toast(error.message);

    if (hoursUsed > 0) {
      const rem = Number(st.profile.bonus_hours) - hoursUsed;
      await sb.from('hurbil_profiles').update({ bonus_hours: rem }).eq('id', st.user.id);
    } else {
      await sb.from('hurbil_payments').insert({
        family_id: st.user.id,
        product_code: st.planType,
        amount_eur: totalEur,
        hours_credited: 0,
        status: 'paid'
      });
    }

    toast(_('✅ Solicitud enviada. Coordinación Hurbil asignará tu acompañante.', '✅ Eskaera bidalita.'));
    st.route = 'family_home';
    await syncAll();
  }

  async function cancelBooking(bk) {
    const serviceStart = new Date(`${bk.service_date}T${bk.start_time}`);
    const hoursDiff = (serviceStart - new Date()) / 3600000;
    if (hoursDiff < 24) {
      return toast(_('⚠️ Faltan menos de 24h. Llama al 644 270 017 para gestionar cambios.', '⚠️ 24 ordu baino gutxiago falta dira. Deitu 644 270 017 zenbakira.'));
    }

    await sb.from('hurbil_bookings').update({ status: 'cancelled' }).eq('id', bk.id);
    if (Number(bk.hours_deducted) > 0) {
      const restored = Number(st.profile.bonus_hours) + Number(bk.hours_deducted);
      await sb.from('hurbil_profiles').update({ bonus_hours: restored }).eq('id', st.user.id);
    }
    toast(_('✅ Cita cancelada gratuitamente (>24h). Saldo/reembolso tramitado.', '✅ Hitzordua doan bertan behera utzita.'));
    await syncAll();
  }

  async function submitPin(bookingId, type) {
    const inputEl = document.getElementById(`pin-${type}-${bookingId}`);
    const pinVal = (inputEl?.value || '').trim();
    if (pinVal.length !== 4) return toast(_('Introduce los 4 dígitos del PIN', 'Sartu 4 digituko PINa'));

    const { data, error } = await sb.rpc('validate_hurbil_pin', {
      p_booking_id: bookingId,
      p_pin: pinVal,
      p_type: type
    });

    if (error || !data?.ok) {
      return toast(data?.error || error?.message || 'Error al validar PIN');
    }

    sb.functions.invoke('hurbil-api', {
      body: { action: 'send_pin_email', payload: data }
    }).catch(() => {});

    toast(type === 'entry'
      ? _('✅ PIN de Entrada validado. Familia notificada.', '✅ Sarrera PINa balioztatuta.')
      : _('✅ PIN de Salida validado. Servicio completado.', '✅ Irteera PINa balioztatuta.')
    );
    await syncAll();
  }

  async function reportIncident(bookingId) {
    const msg = prompt(_('Describe brevemente la incidencia para el equipo de guardia Hurbil:', 'Azaldu labur gertakaria:'));
    if (!msg) return;
    await sb.from('hurbil_bookings').update({ incident_reported: true, incident_details: msg }).eq('id', bookingId);
    toast(_('🚨 Incidencia registrada. Central Hurbil contactará de inmediato.', '🚨 Gertakaria erregistratuta.'));
    await syncAll();
  }

  async function rateBooking(bookingId, stars) {
    await sb.from('hurbil_bookings').update({ rating: stars }).eq('id', bookingId);
    toast(_(`⭐ Gracias por valorar el servicio con ${stars} estrellas.`, `⭐ Eskerrik asko ${stars} izarrekin baloratzeagatik.`));
    await syncAll();
  }

  async function assignEmployee(bookingId) {
    const empId = document.getElementById(`assign-${bookingId}`)?.value;
    if (!empId) return toast(_('Selecciona un empleado de plantilla', 'Hautatu langile bat'));
    await sb.from('hurbil_bookings').update({ employee_id: empId, status: 'confirmed' }).eq('id', bookingId);
    toast(_('✅ Empleado asignado. Cita confirmada y PINs generados.', '✅ Langilea esleituta.'));
    await syncAll();
  }

  async function createInternalEmployee(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const { data, error } = await sb.functions.invoke('hurbil-api', {
      body: {
        action: 'create_employee',
        payload: {
          full_name: fd.get('full_name'),
          email: fd.get('email'),
          password: fd.get('password'),
          phone: fd.get('phone'),
          bio: fd.get('bio')
        }
      }
    });
    if (error || data?.error) return toast(data?.error || error.message);
    toast(_('✅ Empleado interno dado de alta en plantilla', '✅ Langile berria altan emanda'));
    e.target.reset();
    await syncAll();
  }

  function render() {
    const navEl = document.getElementById('nav-actions');
    const appEl = document.getElementById('app');

    if (!st.user || !st.profile) {
      navEl.innerHTML = '';
      appEl.innerHTML = renderAuth();
      return;
    }

    navEl.innerHTML = `
      <span class="badge">${st.profile.role === 'admin' ? 'ADMIN' : st.profile.role === 'employee' ? 'EMPLEADO' : `Bono: ${st.profile.bonus_hours}h`}</span>
      <button onclick="logout()">${_('Salir', 'Irten')}</button>
    `;

    if (st.profile.role === 'family') {
      appEl.innerHTML = renderFamilyDashboard();
    } else if (st.profile.role === 'admin') {
      appEl.innerHTML = renderAdminDashboard();
    } else if (st.profile.role === 'employee') {
      appEl.innerHTML = renderEmployeeDashboard();
    }
  }

  function renderAuth() {
    return `
      <div class="card">
        <div style="display:flex;gap:8px;margin-bottom:16px;">
          <button class="${st.authMode === 'register' ? 'primary' : ''}" onclick="st.authMode='register';render()">
            ${_('Crear cuenta familiar', 'Sortu familia kontua')}
          </button>
          <button class="${st.authMode === 'login' ? 'primary' : ''}" onclick="st.authMode='login';render()">
            ${_('Ya tengo cuenta / Personal', 'Sartu kontura / Langileak')}
          </button>
        </div>

        ${st.authMode === 'login' ? `
          <form onsubmit="handleLogin(event)">
            <h2>${_('Acceso a Hurbil Bilbao', 'Hurbil Bilbora sarrera')}</h2>
            <label>${_('Correo electrónico', 'Posta elektronikoa')}</label>
            <input type="email" name="email" required />
            <label>${_('Contraseña', 'Pasahitza')}</label>
            <input type="password" name="password" required />
            <button type="submit" class="primary" style="width:100%;margin-top:16px;">${_('Entrar', 'Sartu')}</button>
          </form>
        ` : `
          <form onsubmit="handleRegister(event)">
            <h2>${_('Registro de Cliente / Familia en Bilbao', 'Bezero / Familia Erregistroa Bilbon')}</h2>
            <p style="color:var(--muted);font-size:0.92rem;">
              ${_('Todos nuestros acompañantes son personal contratado directamente por Hurbil.', 'Gure laguntzaile guztiak Hurbilek zuzenean kontratatutako langileak dira.')}
            </p>
            <div class="grid-2">
              <div>
                <label>${_('Nombre del titular que contrata', 'Kontratatzen duen titularraren izena')}</label>
                <input name="full_name" placeholder="Ej. Amaia Etxebarria" required />
              </div>
              <div>
                <label>${_('Teléfono móvil de contacto', 'Harremanetarako mugikorra')}</label>
                <input name="phone" placeholder="600 000 000" required />
              </div>
            </div>
            <div class="grid-2">
              <div>
                <label>${_('Correo electrónico (para avisos PIN)', 'Posta elektronikoa (PIN abisuetarako)')}</label>
                <input type="email" name="email" required />
              </div>
              <div>
                <label>${_('Contraseña', 'Pasahitza')}</label>
                <input type="password" name="password" minlength="6" required />
              </div>
            </div>

            <hr style="margin:18px 0;border:0;border-top:1px solid var(--border);" />
            <h3>${_('Datos de la persona mayor a acompañar (Bilbao)', 'Lagunduko den adinekoaren datuak (Bilbo)')}</h3>
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
              <input type="checkbox" name="is_self" style="width:auto;" onchange="document.getElementById('ben-extra').style.display=this.checked?'none':'block'" />
              ${_('Contrato el acompañamiento para mí mismo/a', 'Niretzat kontratatzen dut laguntza')}
            </label>

            <div id="ben-extra">
              <div class="grid-2">
                <div>
                  <label>${_('Nombre del familiar mayor', 'Adineko senidearen izena')}</label>
                  <input name="ben_name" placeholder="Ej. Javier Etxebarria" />
                </div>
                <div>
                  <label>${_('Teléfono del domicilio / mayor', 'Etxeko / adinekoaren telefonoa')}</label>
                  <input name="ben_phone" placeholder="944 000 000" />
                </div>
              </div>
            </div>

            <div class="grid-2">
              <div>
                <label>${_('Barrio de Bilbao', 'Bilboko auzoa')}</label>
                <select name="neighborhood">
                  ${BARRIOS_BILBAO.map(b => `<option value="${b}">${b}</option>`).join('')}
                </select>
              </div>
              <div>
                <label>${_('Dirección exacta (Calle, portal, piso)', 'Helbide zehatza (Kalea, ataria, pisua)')}</label>
                <input name="exact_address" placeholder="Ej. Calle Ercilla 24, 3º Izq" required />
              </div>
            </div>
            <label>${_('Notas de acceso / portal (opcional)', 'Atariko oharrak (aukerakoa)')}</label>
            <input name="access_notes" placeholder="Ej. Portero automático 3B, ascensor cota cero" />

            <label style="display:flex;align-items:flex-start;gap:10px;margin-top:16px;background:var(--primary-light);padding:12px;border-radius:10px;">
              <input type="checkbox" name="non_medical_ok" required style="width:auto;margin-top:4px;" />
              <span>
                ${_('Acepto los términos y comprendo que Hurbil presta un servicio <strong>estrictamente no sanitario</strong> (no incluye administración de medicación ni curas médicas).',
                    'Baldintzak onartzen ditut eta ulertzen dut Hurbilek <strong>zerbitzu ez-sanitarioa</strong> eskaintzen duela (ez du botikarik edo sendaketarik barne hartzen).')}
              </span>
            </label>

            <button type="submit" class="primary" style="width:100%;margin-top:16px;font-size:1.05rem;">
              ${_('Completar registro en Hurbil', 'Osatu erregistroa Hurbilen')}
            </button>
          </form>
        `}
      </div>
    `;
  }

  function renderFamilyDashboard() {
    const ben = st.beneficiaries[0];
    return `
      ${st.notifications.length ? `
        <div class="card" style="border-left:5px solid var(--primary);">
          <strong>🔔 ${_('Últimos avisos de seguridad', 'Azken segurtasun abisuak')}</strong>
          ${st.notifications.slice(0, 2).map(n => `<div style="font-size:0.9rem;margin-top:6px;">• <strong>${n.title}:</strong> ${n.body}</div>`).join('')}
        </div>
      ` : ''}

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div>
            <h2>${_('Hola,', 'Kaixo,')} ${st.profile.full_name}</h2>
            <small>${_('Beneficiario:', 'Onuraduna:')} <strong>${ben?.full_name || ''}</strong> (${ben?.neighborhood || ''} · ${ben?.exact_address || ''})</small>
          </div>
          <div style="text-align:right;">
            <span class="badge" style="font-size:1rem;padding:8px 14px;">⏱️ ${_('Saldo Bono:', 'Bonu Saldo:')} ${st.profile.bonus_hours}h</span>
          </div>
        </div>

        <h3 style="margin-top:18px;">${_('1. Tarifas fijas Hurbil (IVA incluido · Mínimo 1h)', '1. Hurbil tarifa finkoak (BEZa barne · Gutxienez 1h)')}</h3>
        <div class="grid-2">
          <div class="rate-box ${st.planType === 'single_hour' ? 'selected' : ''}" onclick="st.planType='single_hour';render()">
            <div class="rate-price">21,00 €/h</div>
            <strong>${_('Hora suelta', 'Ordu soltea')}</strong>
            <div style="font-size:0.85rem;color:var(--muted);">${_('Pago puntual por sesión individual', 'Saio bakarrerako ordainketa')}</div>
          </div>
          <div class="rate-box ${st.planType === 'bonus_use' ? 'selected' : ''}" onclick="st.planType='bonus_use';render()">
            <div class="rate-price">${_('Usar Bono', 'Erabili Bonua')} (${st.profile.bonus_hours}h)</div>
            <strong>${_('Descontar de mi saldo', 'Nire saldotik deskontatu')}</strong>
            <div style="font-size:0.85rem;color:var(--muted);">${_('Con Bono 5h (19,50 €/h) o Plan 12h (18,00 €/h)', '5h Bonuarekin edo 12h Planarekin')}</div>
          </div>
          <div class="rate-box ${st.planType === 'joint_plan' ? 'selected' : ''}" onclick="st.planType='joint_plan';render()">
            <div class="rate-price">16,00 €/h <small style="font-size:0.8rem;">/persona</small></div>
            <strong>${_('Plan Conjunto (2 vecinos a la vez)', 'Plan Bateratua (2 bizilagun batera)')}</strong>
            <div style="font-size:0.85rem;color:var(--muted);">${_('32,00 €/h total compartido en mismo portal/barrio', '32,00 €/h guztira atari/auzo berean')}</div>
          </div>
        </div>

        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;">
          <button onclick="buyBonusPack('bonus_5h', 5, 97.50)">➕ ${_('Recargar Bono 5 horas (97,50 € · 19,50 €/h)', 'Kargatu 5 orduko Bonua (97,50 €)')}</button>
          <button onclick="buyBonusPack('monthly_12h', 12, 216.00)">➕ ${_('Activar Plan Mensual 12 horas (216,00 € · 18,00 €/h)', 'Aktibatu Hileko 12h Plana (216,00 €)')}</button>
        </div>

        <h3 style="margin-top:20px;">${_('2. Solicitar acompañamiento', '2. Eskatu laguntza')}</h3>
        <div class="grid-2">
          <div>
            <label>${_('Fecha del servicio', 'Zerbitzuaren data')}</label>
            <input type="date" value="${st.serviceDate}" onchange="st.serviceDate=this.value" />
          </div>
          <div>
            <label>${_('Hora de inicio', 'Hasiera ordua')}</label>
            <input type="time" value="${st.startTime}" onchange="st.startTime=this.value" />
          </div>
          <div>
            <label>${_('Duración (mínimo 1h, tramos 30 min)', 'Iraupena (gutxienez 1h)')}</label>
            <select onchange="st.durationHours=Number(this.value);render()">
              ${[1, 1.5, 2, 2.5, 3, 3.5, 4].map(h => `<option value="${h}" ${st.durationHours === h ? 'selected' : ''}>${h} horas</option>`).join('')}
            </select>
          </div>
        </div>

        <label>${_('Tareas del día (no sanitarias)', 'Eguneko zereginak (ez-sanitarioak)')}</label>
        <div>
          ${TAREAS_OPCIONES.map(t => {
            const active = st.selectedTasks.includes(t.id);
            return `<span class="task-chip ${active ? 'active' : ''}" onclick="toggleTask('${t.id}')">${_(t.es, t.eu)}</span>`;
          }).join('')}
        </div>

        <label>${_('Indicaciones adicionales para nuestro empleado', 'Gure langilearentzako argibide gehigarriak')}</label>
        <input value="${st.extraNotes}" onchange="st.extraNotes=this.value" placeholder="Ej. Llevar paraguas si llueve, gusta pasear por Doña Casilda" />

        <button class="primary" style="width:100%;margin-top:16px;font-size:1.05rem;" onclick="createBooking()">
          ${_('Confirmar solicitud de acompañamiento', 'Baieztatu laguntza eskaera')}
        </button>
      </div>

      <div class="card">
        <h3>${_('Mis citas y Protocolo Doble PIN', 'Nire hitzorduak eta PIN Bikoitza')}</h3>
        ${!st.bookings.length ? `<p style="color:var(--muted);">${_('Aún no tienes citas programadas.', 'Oraindik ez duzu hitzordurik.')}</p>` : ''}
        ${st.bookings.map(bk => `
          <div style="border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
              <strong>📅 ${bk.service_date} · ⏰ ${bk.start_time.slice(0,5)} (${bk.duration_hours}h)</strong>
              <span class="badge ${bk.status === 'in_progress' ? 'live' : bk.status === 'pending_assignment' ? 'warn' : ''}">
                ${bk.status === 'pending_assignment' ? _('Pendiente de asignar empleado', 'Langilea esleitzeko zain')
                  : bk.status === 'confirmed' ? _('Confirmada · Empleado asignado', 'Baieztatuta')
                  : bk.status === 'in_progress' ? _('🟢 EN CURSO EN DOMICILIO', '🟢 MARTXAN ETXEAN')
                  : bk.status === 'completed' ? _('Finalizada', 'Amaituta')
                  : _('Cancelada', 'Bertan behera')}
              </span>
            </div>

            ${bk.hurbil_profiles ? `<p style="margin:6px 0;">👤 ${_('Acompañante Hurbil:', 'Hurbil Laguntzailea:')} <strong>${bk.hurbil_profiles.full_name}</strong> (${bk.hurbil_profiles.phone || ''})</p>` : ''}

            ${['confirmed', 'in_progress'].includes(bk.status) ? `
              <div class="pin-banner">
                <div class="pin-card">
                  <small>${_('PIN DE ENTRADA (Dar al llegar)', 'SARRERA PINa (Iristean eman)')}</small>
                  <span class="pin-digits">${bk.pin_entry}</span>
                </div>
                <div class="pin-card">
                  <small>${_('PIN DE SALIDA (Dar al irse)', 'IRTEERA PINa (Joatean eman)')}</small>
                  <span class="pin-digits">${bk.pin_exit}</span>
                </div>
              </div>
            ` : ''}

            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
              ${['pending_assignment', 'confirmed'].includes(bk.status) ? `
                <button onclick='cancelBooking(${JSON.stringify(bk)})'>${_('Cancelar cita (>24h gratis)', 'Bertan behera utzi (>24h doan)')}</button>
              ` : ''}
              ${bk.status === 'in_progress' ? `
                <button class="danger" onclick="reportIncident('${bk.id}')">⚠️ ${_('Reportar incidencia en curso', 'Jakinarazi gertakaria')}</button>
              ` : ''}
              ${bk.status === 'completed' && !bk.rating ? `
                <div>
                  <span>${_('Valora el servicio:', 'Baloratu zerbitzua:')} </span>
                  ${[1,2,3,4,5].map(n => `<button onclick="rateBooking('${bk.id}', ${n})">${n}⭐</button>`).join('')}
                </div>
              ` : ''}
              ${bk.rating ? `<span class="badge">⭐ ${_('Valorado:', 'Baloratuta:')} ${bk.rating}/5</span>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function toggleTask(id) {
    if (st.selectedTasks.includes(id)) {
      st.selectedTasks = st.selectedTasks.filter(x => x !== id);
    } else {
      st.selectedTasks.push(id);
    }
    render();
  }

  function renderAdminDashboard() {
    return `
      <div class="card">
        <h2>🛠️ Panel de Coordinación Hurbil Bilbao (Admin)</h2>
        <h3>1. Asignar empleados internos a reservas</h3>
        ${st.bookings.map(bk => `
          <div style="border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;flex-wrap:wrap;">
              <strong>📅 ${bk.service_date} · ${bk.start_time.slice(0,5)} (${bk.duration_hours}h) — ${bk.plan_type}</strong>
              <span class="badge ${bk.status === 'pending_assignment' ? 'warn' : ''}">${bk.status}</span>
            </div>
            <p style="margin:6px 0;">
              <strong>Beneficiario:</strong> ${bk.hurbil_beneficiaries?.full_name} · <strong>${bk.hurbil_beneficiaries?.neighborhood}</strong> (${bk.hurbil_beneficiaries?.exact_address})<br/>
              <strong>Familia:</strong> ${bk.hurbil_profiles?.full_name} (${bk.hurbil_profiles?.phone}) · <strong>Tareas:</strong> ${(bk.tasks || []).join(', ')}
            </p>
            ${bk.incident_reported ? `<div style="color:var(--danger);font-weight:700;">🚨 INCIDENCIA: ${bk.incident_details}</div>` : ''}
            <div style="display:flex;gap:8px;margin-top:8px;">
              <select id="assign-${bk.id}">
                <option value="">-- Seleccionar empleado de plantilla --</option>
                ${st.employees.map(emp => `<option value="${emp.id}" ${bk.employee_id === emp.id ? 'selected' : ''}>${emp.full_name} (${emp.phone || ''})</option>`).join('')}
              </select>
              <button class="primary" onclick="assignEmployee('${bk.id}')">Asignar y Confirmar</button>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="card">
        <h3>2. Dar de alta nuevo empleado interno en plantilla</h3>
        <form onsubmit="createInternalEmployee(event)">
          <div class="grid-2">
            <div>
              <label>Nombre completo del empleado/a</label>
              <input name="full_name" required />
            </div>
            <div>
              <label>Teléfono móvil</label>
              <input name="phone" required />
            </div>
            <div>
              <label>Correo corporativo / acceso</label>
              <input type="email" name="email" required />
            </div>
            <div>
              <label>Contraseña inicial</label>
              <input type="password" name="password" minlength="6" required />
            </div>
          </div>
          <label>Perfil / especialidad (opcional)</label>
          <input name="bio" placeholder="Ej. Auxiliar geriátrico con experiencia en acompañamiento en Bilbao" />
          <button type="submit" class="primary" style="margin-top:12px;">Registrar Empleado Interno</button>
        </form>
      </div>
    `;
  }

  function renderEmployeeDashboard() {
    return `
      <div class="card">
        <h2>👋 Turnos asignados · ${st.profile.full_name}</h2>
        ${!st.bookings.length ? '<p>No tienes servicios asignados todavía.</p>' : ''}
        ${st.bookings.map(bk => `
          <div style="border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;">
            <div style="display:flex;justify-content:space-between;">
              <strong>📅 ${bk.service_date} · ⏰ ${bk.start_time.slice(0,5)} (${bk.duration_hours}h)</strong>
              <span class="badge">${bk.status}</span>
            </div>
            <p style="margin:8px 0;">
              <strong>Persona mayor:</strong> ${bk.hurbil_beneficiaries?.full_name} (Tel: ${bk.hurbil_beneficiaries?.phone})<br/>
              <strong>Dirección Bilbao:</strong> ${bk.hurbil_beneficiaries?.neighborhood} — ${bk.hurbil_beneficiaries?.exact_address}<br/>
              <strong>Portal / acceso:</strong> ${bk.hurbil_beneficiaries?.access_notes || 'Sin notas'}<br/>
              <strong>Tareas:</strong> ${(bk.tasks || []).join(', ')} ${bk.extra_notes ? `(${bk.extra_notes})` : ''}
            </p>

            ${bk.status === 'confirmed' ? `
              <div style="display:flex;gap:8px;align-items:center;margin-top:10px;">
                <input id="pin-entry-${bk.id}" maxlength="4" placeholder="PIN Entrada (4 dígitos)" style="max-width:200px;" />
                <button class="primary" onclick="submitPin('${bk.id}', 'entry')">🟢 Validar Entrada</button>
              </div>
            ` : ''}

            ${bk.status === 'in_progress' ? `
              <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;">
                <input id="pin-exit-${bk.id}" maxlength="4" placeholder="PIN Salida (4 dígitos)" style="max-width:200px;" />
                <button class="primary" onclick="submitPin('${bk.id}', 'exit')">🏁 Validar Salida</button>
                <button class="danger" onclick="reportIncident('${bk.id}')">⚠️ Reportar Incidencia</button>
              </div>
            ` : ''}
          </div>
        `).join('')}
      </div>
    `;
  }

  init();
</script>
</body>
</html>
